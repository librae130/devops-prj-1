---
# ==============================================================================
# Part 3: Deploy Google Online Boutique using Ansible & Helm
# Extended with:
# - Rubric 4: Ingress Controller support (frontend on ClusterIP, routing on boutique.local)
# - Rubric 5: Probes & Resource Limits using cleanly vendored extended charts
# - Rubric 6: PodDisruptionBudget policies
# ==============================================================================
- name: Deploy Online Boutique Microservices Application
  hosts: k8s-master
  become: yes

  vars_files:
    - ../vars/microservices.yml

  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf

  tasks:
    - name: Ensure git is installed on the control plane
      ansible.builtin.apt:
        name: git
        state: present
        update_cache: no

    # --------------------------------------------------------------------------
    # 1. Distribute vendored charts and clone upstream values
    # --------------------------------------------------------------------------
    - name: Ensure vendored charts directory exists on master
      ansible.builtin.file:
        path: "{{ charts_dest }}"
        state: directory
        mode: "0755"

    - name: Copy vendored Helm charts to master
      ansible.builtin.copy:
        src: ../charts/
        dest: "{{ charts_dest }}/"
        mode: "0755"

    - name: Clone upstream Helm chart repository (pinned commit for values files)
      ansible.builtin.git:
        repo: "{{ chart_repo }}"
        dest: "{{ src }}"
        version: "{{ chart_version }}"
        force: no

    - name: Ensure microservice namespace exists
      kubernetes.core.k8s:
        api_version: v1
        kind: Namespace
        name: "{{ app_namespace }}"
        state: present

    # --------------------------------------------------------------------------
    # 2. Deploy all 11 microservices using Helm and the layered overrides:
    # - Upstream values files remain 100% UNCHANGED
    # - Overrides layer on top:
    #   * appReplicas: 1 (via common)
    #   * frontend: serviceType: ClusterIP + Ingress boutique.local
    #   * checkoutservice: appName: checkoutservice (upstream bug fix)
    #   * probes and resource requests/limits on all services
    #   * PDB on critical components
    # --------------------------------------------------------------------------
    - name: Deploy Online Boutique releases via Helm
      kubernetes.core.helm:
        name: "{{ item.release }}"
        chart_ref: "{{ charts_dest }}/{{ item.chart }}"
        release_namespace: "{{ app_namespace }}"
        create_namespace: false
        values_files:
          - "{{ src }}/{{ item.values_file }}"
        values: "{{ common | combine(item.overrides | default({})) }}"
        wait: yes
        wait_timeout: 300s
      loop: "{{ microservices }}"
      loop_control:
        label: "{{ item.release }} (chart: {{ item.chart }})"

    - name: Wait for all microservice deployments to have available replicas
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: Deployment
        name: "{{ item.expected_deployment }}"
        namespace: "{{ app_namespace }}"
      register: deploy_check
      until:
        - deploy_check.resources is defined
        - deploy_check.resources | length > 0
        - deploy_check.resources[0].status.availableReplicas is defined
        - deploy_check.resources[0].status.availableReplicas >= 1
      retries: 30
      delay: 5
      loop: "{{ microservices }}"
      loop_control:
        label: "{{ item.expected_deployment }}"

    # --------------------------------------------------------------------------
    # 3. Assert frontend Service is ClusterIP and Ingress exists (Rubric 4)
    # --------------------------------------------------------------------------
    - name: Retrieve frontend Service details
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Service
        name: frontend
        namespace: "{{ app_namespace }}"
      register: frontend_service_info

    - name: Assert frontend Service is ClusterIP
      ansible.builtin.assert:
        that:
          - frontend_service_info.resources is defined
          - frontend_service_info.resources | length > 0
          - frontend_service_info.resources[0].spec.type == "ClusterIP"
        fail_msg: "Frontend service was expected to be ClusterIP!"

    - name: Retrieve frontend Ingress details
      kubernetes.core.k8s_info:
        api_version: networking.k8s.io/v1
        kind: Ingress
        name: frontend
        namespace: "{{ app_namespace }}"
      register: frontend_ingress_info

    - name: Assert frontend Ingress is configured with boutique.local
      ansible.builtin.assert:
        that:
          - frontend_ingress_info.resources is defined
          - frontend_ingress_info.resources | length > 0
          - frontend_ingress_info.resources[0].spec.rules[0].host == "boutique.local"
        fail_msg: "Frontend Ingress is not configured with host boutique.local!"

    - name: Display storefront Ingress access details
      ansible.builtin.debug:
        msg:
          - "======================================================================"
          - "ONLINE BOUTIQUE DEPLOYMENT SUCCESSFUL (INGRESS + PROBES + LIMITS + PDB)"
          - "======================================================================"
          - "Namespace:        {{ app_namespace }}"
          - "Total Releases:    {{ microservices | length }}"
          - "Frontend Service:  ClusterIP (exposing port 80 internally)"
          - "Ingress Hostname:  boutique.local (Port: 30080)"
          - ""
          - "Access URL (add '192.168.56.11 boutique.local' to C:\\Windows\\System32\\drivers\\etc\\hosts):"
          - "  http://boutique.local:30080/"
          - ""
          - "Direct HTTP access via curl with Host header:"
          - "  curl -H 'Host: boutique.local' http://192.168.56.11:30080/"
          - "======================================================================"
