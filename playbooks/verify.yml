---
# ==============================================================================
# Part 4: Comprehensive Automated Verification Playbook
# Satisfies:
# - Baseline Part 4: 5 strict health assertions
# - Rubric 4: Ingress hostname routing (positive 200 & negative 404), frontend ClusterIP
# - Rubric 5: Probes (liveness/readiness on >=4 services) and resource limits
# - Rubric 6: PodDisruptionBudget (PDB) existence
#
# Any failure halts the play immediately.
# ==============================================================================
- name: Verify Online Boutique Deployment, Ingress, Probes, Limits, and PDB
  hosts: k8s-master
  become: yes

  vars_files:
    - ../vars/microservices.yml

  vars:
    expected_deployments:
      - redis-cart
      - emailservice
      - paymentservice
      - shippingservice
      - currencyservice
      - productcatalogservice
      - cartservice
      - recommendationservice
      - adservice
      - checkoutservice
      - frontend

    expected_pdbs:
      - frontend
      - cartservice
      - checkoutservice
      - productcatalogservice

  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf

  tasks:
    # --------------------------------------------------------------------------
    # Assertion 1: Cluster Nodes Status and Private Network Registration
    # --------------------------------------------------------------------------
    - name: "[Check 1/7] Retrieve cluster node information"
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Node
      register: cluster_nodes

    - name: "[Check 1/7] Extract node status and InternalIPs"
      ansible.builtin.set_fact:
        node_ips: >-
          {{
            cluster_nodes.resources
            | map(attribute='status.addresses')
            | flatten
            | selectattr('type', 'equalto', 'InternalIP')
            | map(attribute='address')
            | list
          }}
        all_nodes_ready: >-
          {{
            cluster_nodes.resources
            | map(attribute='status.conditions')
            | flatten
            | selectattr('type', 'equalto', 'Ready')
            | map(attribute='status')
            | list
          }}

    - name: "[Check 1/7] Assert nodes are Ready on private network 192.168.56.x"
      ansible.builtin.assert:
        that:
          - cluster_nodes.resources | length >= 2
          - all_nodes_ready | unique == ['True']
          - "'192.168.56.10' in node_ips"
          - "'192.168.56.11' in node_ips"
        fail_msg: "Cluster nodes check failed! Ensure nodes are Ready on 192.168.56.x."
        success_msg: "Check 1 Passed: Nodes are Ready on private network 192.168.56.x."

    # --------------------------------------------------------------------------
    # Assertion 2: All 11 Deployments Have Available Replicas
    # --------------------------------------------------------------------------
    - name: "[Check 2/7] Assert all 11 Deployments are Available"
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: Deployment
        name: "{{ item }}"
        namespace: "{{ app_namespace }}"
      register: dep_check
      failed_when: >-
        dep_check.resources is not defined or
        dep_check.resources | length == 0 or
        (dep_check.resources[0].status.availableReplicas | default(0) | int < 1)
      loop: "{{ expected_deployments }}"

    # --------------------------------------------------------------------------
    # Assertion 3: Bug Diagnosis Check (checkoutservice vs servicename)
    # --------------------------------------------------------------------------
    - name: "[Check 3/7] Assert bug fix: 'servicename' Deployment MUST NOT exist"
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: Deployment
        name: servicename
        namespace: "{{ app_namespace }}"
      register: buggy_dep
      failed_when: buggy_dep.resources | length > 0

    - name: "[Check 3/7] Verify checkoutservice Service endpoint exists on port 5050"
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Service
        name: checkoutservice
        namespace: "{{ app_namespace }}"
      register: checkout_svc

    - name: "[Check 3/7] Assert checkoutservice Service is present and exposing port 5050"
      ansible.builtin.assert:
        that:
          - checkout_svc.resources is defined
          - checkout_svc.resources | length > 0
          - checkout_svc.resources[0].spec.ports[0].port == 5050
        fail_msg: "checkoutservice Service does not exist or does not expose port 5050!"
        success_msg: "Check 3 Passed: checkoutservice exists and exposes port 5050."

    # --------------------------------------------------------------------------
    # Assertion 4: Frontend Service is ClusterIP & Ingress Exists (Rubric 4)
    # --------------------------------------------------------------------------
    - name: "[Check 4/7] Retrieve frontend Service details"
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Service
        name: frontend
        namespace: "{{ app_namespace }}"
      register: frontend_svc

    - name: "[Check 4/7] Assert frontend Service is ClusterIP"
      ansible.builtin.assert:
        that:
          - frontend_svc.resources is defined
          - frontend_svc.resources | length > 0
          - frontend_svc.resources[0].spec.type == "ClusterIP"
        fail_msg: "Frontend Service was expected to be ClusterIP!"
        success_msg: "Check 4 Passed: frontend Service is ClusterIP."

    - name: "[Check 4/7] Retrieve frontend Ingress resource"
      kubernetes.core.k8s_info:
        api_version: networking.k8s.io/v1
        kind: Ingress
        name: frontend
        namespace: "{{ app_namespace }}"
      register: frontend_ing

    - name: "[Check 4/7] Assert Ingress routes host boutique.local"
      ansible.builtin.assert:
        that:
          - frontend_ing.resources is defined
          - frontend_ing.resources | length > 0
          - frontend_ing.resources[0].spec.rules[0].host == "boutique.local"
        fail_msg: "Frontend Ingress rule for boutique.local is missing!"
        success_msg: "Check 4 Passed: Ingress routes host boutique.local."

    # --------------------------------------------------------------------------
    # Assertion 5: Ingress HTTP Routing (Positive 200 & Negative 404) (Rubric 4)
    # --------------------------------------------------------------------------
    - name: "[Check 5/7] Positive Check: HTTP GET boutique.local:30080 returns 200"
      ansible.builtin.uri:
        url: "http://192.168.56.11:30080/"
        headers:
          Host: "boutique.local"
        method: GET
        return_content: yes
        status_code: 200
        timeout: 15
      register: ingress_response

    - name: "[Check 5/7] Assert storefront content is returned via Ingress"
      ansible.builtin.assert:
        that:
          - ingress_response.status == 200
          - "'Online Boutique' in ingress_response.content"
        fail_msg: "Ingress positive check failed! Content did not contain 'Online Boutique'."
        success_msg: "Check 5 Passed: Ingress routing for boutique.local returned HTTP 200."

    - name: "[Check 5/7] Negative Check: HTTP GET invalid host returns 404"
      ansible.builtin.uri:
        url: "http://192.168.56.11:30080/"
        headers:
          Host: "invalid.domain.local"
        method: GET
        status_code: 404
        timeout: 10
      register: negative_ingress_response
      failed_when: negative_ingress_response.status != 404

    - name: "[Check 5/7] Assert negative routing test passed"
      ansible.builtin.assert:
        that:
          - negative_ingress_response.status == 404
        fail_msg: "Negative Ingress check failed! Expected 404 on unmapped host."
        success_msg: "Check 5 Passed: Negative Ingress test returned HTTP 404 (proves hostname routing)."

    # --------------------------------------------------------------------------
    # Assertion 6: Probes & Resource Limits (Rubric 5)
    # Assert >= 4 Deployments have livenessProbe, readinessProbe, and resources
    # --------------------------------------------------------------------------
    - name: "[Check 6/7] Inspect Deployments for probes and resource limits"
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: Deployment
        name: "{{ item }}"
        namespace: "{{ app_namespace }}"
      register: probe_check
      loop:
        - frontend
        - checkoutservice
        - productcatalogservice
        - cartservice
        - paymentservice

    - name: "[Check 6/7] Assert all inspected services have probes and limits"
      ansible.builtin.assert:
        that:
          - item.resources[0].spec.template.spec.containers[0].livenessProbe is defined
          - item.resources[0].spec.template.spec.containers[0].readinessProbe is defined
          - item.resources[0].spec.template.spec.containers[0].resources.requests is defined
          - item.resources[0].spec.template.spec.containers[0].resources.limits is defined
        fail_msg: "Deployment {{ item.item }} is missing probes or resource limits!"
      loop: "{{ probe_check.results }}"
      loop_control:
        label: "{{ item.item }}"

    # --------------------------------------------------------------------------
    # Assertion 7: PodDisruptionBudget (PDB) (Rubric 6)
    # --------------------------------------------------------------------------
    - name: "[Check 7/7] Verify PodDisruptionBudgets exist"
      kubernetes.core.k8s_info:
        api_version: policy/v1
        kind: PodDisruptionBudget
        name: "{{ item }}"
        namespace: "{{ app_namespace }}"
      register: pdb_check
      failed_when: pdb_check.resources | length == 0
      loop: "{{ expected_pdbs }}"

    # --------------------------------------------------------------------------
    # Final Summary Banner
    # --------------------------------------------------------------------------
    - name: Complete Verification Summary
      ansible.builtin.debug:
        msg:
          - "======================================================================"
          - "ALL VERIFICATION CHECKS PASSED (7/7)"
          - "======================================================================"
          - "✓ Check 1: Nodes are Ready on private network (192.168.56.x)"
          - "✓ Check 2: All 11 Deployments are Available"
          - "✓ Check 3: checkoutservice is correctly named (no 'servicename')"
          - "✓ Check 4: frontend is ClusterIP and Ingress exists"
          - "✓ Check 5: Ingress routing passed (Positive HTTP 200, Negative HTTP 404)"
          - "✓ Check 6: Liveness/Readiness probes and resource limits verified (Rubric 5)"
          - "✓ Check 7: PodDisruptionBudgets (PDB) verified on 4 core services (Rubric 6)"
          - ""
          - "Storefront URL: http://boutique.local:30080/"
          - "======================================================================"
