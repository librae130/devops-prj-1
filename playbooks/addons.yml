---
# ==============================================================================
# Add-ons: ingress-nginx (Rubric 4) & metrics-server (Rubric 5)
# Reference: Rubric Items 4 and 5
# ==============================================================================
- name: Deploy Kubernetes Add-ons (Ingress Controller and Metrics Server)
  hosts: k8s-master
  become: yes

  vars:
    ingress_nginx_version: "4.11.3"
    metrics_server_version: "3.12.2"

  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf

  tasks:
    # --------------------------------------------------------------------------
    # 1. Add Helm repositories
    # --------------------------------------------------------------------------
    - name: Add ingress-nginx Helm repository
      kubernetes.core.helm_repository:
        name: ingress-nginx
        repo_url: https://kubernetes.github.io/ingress-nginx

    - name: Add metrics-server Helm repository
      kubernetes.core.helm_repository:
        name: metrics-server
        repo_url: https://kubernetes-sigs.github.io/metrics-server/

    # --------------------------------------------------------------------------
    # 2. Deploy ingress-nginx controller (Rubric Area 4 - 20 marks)
    # Exposes HTTP on fixed NodePort 30080 and HTTPS on 30443 for bare-metal
    # --------------------------------------------------------------------------
    - name: Deploy ingress-nginx controller via Helm
      kubernetes.core.helm:
        name: ingress-nginx
        chart_ref: ingress-nginx/ingress-nginx
        chart_version: "{{ ingress_nginx_version }}"
        release_namespace: ingress-nginx
        create_namespace: true
        values:
          controller:
            service:
              type: NodePort
              nodePorts:
                http: 30080
                https: 30443
        wait: yes
        wait_timeout: 300s

    # --------------------------------------------------------------------------
    # 3. Deploy metrics-server (Rubric Area 5 - 20 marks)
    # Required for 'kubectl top' and resource consumption measurements
    # --------------------------------------------------------------------------
    - name: Deploy metrics-server via Helm
      kubernetes.core.helm:
        name: metrics-server
        chart_ref: metrics-server/metrics-server
        chart_version: "{{ metrics_server_version }}"
        release_namespace: kube-system
        values:
          args:
            - "--kubelet-insecure-tls"
            - "--kubelet-preferred-address-types=InternalIP"
        wait: yes
        wait_timeout: 300s

    # --------------------------------------------------------------------------
    # 4. Wait for add-on pods to be Ready
    # --------------------------------------------------------------------------
    - name: Wait for ingress-nginx controller pod to be Ready
      ansible.builtin.command: >-
        kubectl wait --namespace ingress-nginx
        --for=condition=ready pod
        --selector=app.kubernetes.io/component=controller
        --timeout=180s
      changed_when: false

    - name: Summary banner
      ansible.builtin.debug:
        msg:
          - "======================================================================"
          - "KUBERNETES ADD-ONS DEPLOYED SUCCESSFULLY"
          - "======================================================================"
          - "✓ ingress-nginx v{{ ingress_nginx_version }} (HTTP Port: 30080, HTTPS Port: 30443)"
          - "✓ metrics-server v{{ metrics_server_version }} (kubectl top enabled)"
          - "======================================================================"
