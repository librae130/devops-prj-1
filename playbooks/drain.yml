---
# ==============================================================================
# Rubric Area 6: Node Drain and PodDisruptionBudget (PDB) Demonstration
# Reference: Rubric Item 6 (10 marks)
#
# Usage:
#   ansible-playbook -i inventory.ini playbooks/drain.yml
# ==============================================================================
- name: Demonstrate Node Drain with PodDisruptionBudget
  hosts: k8s-master
  become: yes

  vars_files:
    - ../vars/microservices.yml

  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf

  tasks:
    # --------------------------------------------------------------------------
    # 1. Inspect pods scheduled on node1 before draining
    # --------------------------------------------------------------------------
    - name: Get pods on node1 before drain
      ansible.builtin.command: kubectl get pods -n {{ app_namespace }} -o wide --field-selector spec.nodeName=node1
      register: pods_before_drain
      changed_when: false

    - name: Display pods before drain
      ansible.builtin.debug:
        msg: "{{ pods_before_drain.stdout_lines }}"

    # --------------------------------------------------------------------------
    # 2. Perform node drain on node1
    # PDB ensures evicted services maintain minimum available replicas
    # --------------------------------------------------------------------------
    - name: Drain worker node node1
      ansible.builtin.command: >-
        kubectl drain node1
        --ignore-daemonsets
        --delete-emptydir-data
        --force
        --timeout=180s
      register: drain_output

    - name: Display drain output
      ansible.builtin.debug:
        msg: "{{ drain_output.stdout_lines }}"

    # --------------------------------------------------------------------------
    # 3. Verify storefront continuity during and after drain
    # --------------------------------------------------------------------------
    - name: Verify storefront remains healthy via Ingress after drain
      ansible.builtin.uri:
        url: "http://192.168.56.10:30080/"
        headers:
          Host: "boutique.local"
        method: GET
        status_code: 200
        timeout: 10
      register: store_check
      failed_when: store_check.status != 200

    # --------------------------------------------------------------------------
    # 4. Inspect pods running after drain (evicted to node2)
    # --------------------------------------------------------------------------
    - name: Get pods scheduled on node2 after drain
      ansible.builtin.command: kubectl get pods -n {{ app_namespace }} -o wide --field-selector spec.nodeName=node2
      register: pods_after_drain
      changed_when: false

    - name: Display pods on node2 after drain
      ansible.builtin.debug:
        msg: "{{ pods_after_drain.stdout_lines }}"

    # --------------------------------------------------------------------------
    # 5. Uncordon node1 to restore cluster to normal state
    # --------------------------------------------------------------------------
    - name: Uncordon worker node node1
      ansible.builtin.command: kubectl uncordon node1

    - name: Drain & PDB Summary
      ansible.builtin.debug:
        msg:
          - "======================================================================"
          - "NODE DRAIN AND PDB VERIFICATION COMPLETED (RUBRIC 6)"
          - "======================================================================"
          - "✓ node1 cordoned and drained successfully"
          - "✓ Microservices successfully evicted and rescheduled"
          - "✓ Storefront remained available (HTTP 200) throughout eviction"
          - "✓ node1 uncordoned back to Ready state"
          - "======================================================================"
